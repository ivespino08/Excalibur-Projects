services:
  excalibur:
    container_name: excalibur2
    image: excalibur2:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount workspace for file operations
      - ./workspace:/workspace
      # Persist Claude Code configuration across container restarts
      - claude-config:/home/pentester/.claude
      # Persist CCR configuration
      - ccr-config:/home/pentester/.claude-code-router
    stdin_open: true
    tty: true
    # Run an init process (tini) as PID 1. It reaps zombies from the backgrounded
    # CCR supervisor loop in entrypoint.sh and forwards signals properly, so
    # stop/restart are clean and defunct processes don't accumulate.
    init: true
    # Auto-restart the container if it exits. A detached interactive-bash
    # container can occasionally exit right after start (TTY EOF), which is the
    # "container is not running" case; this brings it back automatically.
    # NOTE: if bash ever exits *immediately and repeatedly* this becomes a
    # restart loop — see the keep-alive note below for the durable fix.
    restart: unless-stopped
    # Mirror the image HEALTHCHECK here so `docker compose ps` reports health and
    # you can gate on it. Uses the CCR proxy port; only meaningful in CCR-backed
    # (openrouter/local) auth modes.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:${CCR_PORT:-3456}/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    # Required for OpenVPN (HackTheBox/TryHackMe connectivity)
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Use host network for easy access to benchmark containers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Resource allocation - adjust based on your system
    # More CPUs and memory improve performance for complex tasks
    deploy:
      resources:
        limits:
          cpus: '4'        # Max 4 CPU cores (adjust higher if available)
          memory: 8G       # Max 8GB RAM
        reservations:
          cpus: '2'        # Guarantee 2 CPU cores
          memory: 4G       # Guarantee 4GB RAM
    environment:
      # Terminal settings for proper TUI rendering
      - TERM=xterm-256color
      # Python settings
      - PYTHONUNBUFFERED=1
      # Auth mode: "openrouter", "anthropic", or "manual"
      - EXCALIBUR_AUTH_MODE=${EXCALIBUR_AUTH_MODE:-manual}
      # API keys (set based on auth mode via .env.auth)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}

volumes:
  # Named volume for Claude Code config persistence
  claude-config:
  # Named volume for CCR config persistence
  ccr-config:
